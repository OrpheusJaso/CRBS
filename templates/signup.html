<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMU Campus Resource Booking - Create account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
</head>
<body class="bg-slate-100 text-slate-900">

  <div id="toast" class="fixed right-4 top-4 z-50 hidden rounded-md border border-rose-200 bg-white px-4 py-3 text-sm shadow-lg">
    <div class="flex items-start gap-3">
      <i data-lucide="alert-circle" class="mt-0.5 h-5 w-5 text-rose-600"></i>
      <div>
        <p id="toastTitle" class="font-semibold text-slate-900">Notice</p>
        <p id="toastMessage" class="text-slate-600"></p>
      </div>
    </div>
  </div>

  <section class="flex min-h-screen items-center justify-center px-6 py-12">
    <div class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
      <div class="mb-8 flex items-center gap-3">
        <div class="flex h-11 w-11 items-center justify-center rounded-md bg-sky-700 text-white">
          <i data-lucide="user-plus" class="h-6 w-6"></i>
        </div>
        <div>
          <p class="text-sm font-medium text-slate-500">MMU Campus</p>
          <h1 class="text-xl font-semibold">Create test account</h1>
        </div>
      </div>

      <form id="signupForm">
        <label class="mb-2 block text-sm font-medium" for="name">Full name</label>
        <input id="name" required value="Test User"
               class="mb-4 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" />

        <label class="mb-2 block text-sm font-medium" for="email">Email address</label>
        <input id="email" type="email" required value="test@mmu.edu.my"
               class="mb-4 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" />

        <label class="mb-2 block text-sm font-medium" for="role">Role</label>
        <select id="role" class="mb-4 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100">
          <option value="student">Student</option>
          <option value="staff" selected>Staff / Faculty</option>
          <option value="manager">Resource Manager</option>
          <option value="admin">Admin</option>
        </select>

        <label class="mb-2 block text-sm font-medium" for="password">Password</label>
        <input id="password" type="password" required value="password123"
               class="mb-5 w-full rounded-md border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-sky-600 focus:ring-2 focus:ring-sky-100" />

        <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-md bg-sky-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-sky-800">
          <i data-lucide="user-plus" class="h-4 w-4"></i> Create account &amp; sign in
        </button>
      </form>

      <p class="mt-5 text-center text-sm text-slate-600">
        Already have an account?
        <a href="{{ url_for('views.login') }}" class="font-semibold text-sky-700 hover:text-sky-900">Sign in</a>
      </p>
    </div>
  </section>

  <script>
    window.CRBS = {
      urls: {
        login: "{{ url_for('views.login') }}",
        dashboard: "{{ url_for('views.dashboard') }}"
      }
    };
    window.CRBS_NO_AUTH_REDIRECT = true; // don't bounce on this public page
  </script>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</body>
</html>
